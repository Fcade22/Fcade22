<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hojas Membretadas · SKIN LEATHER</title>
<meta name="theme-color" content="#3b2a1d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Membrete SL">
<style>
  :root {
    --cafe-oscuro: #3b2a1d;
    --cafe: #5a4231;
    --cafe-medio: #7a5c43;
    --caramelo: #a07a52;
    --crema: #f3ece2;
    --crema-input: #fbf8f3;
    --borde: #e2d6c5;
    --texto: #3a2e26;
    --tenue: #978977;
    --error: #9c4631;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--crema);
    color: var(--texto);
    padding: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .tarjeta {
    width: 100%;
    max-width: 460px;
    margin-top: 26px;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(59, 42, 29, 0.13);
    overflow: hidden;
  }
  .cabecera {
    background: var(--cafe-oscuro);
    color: var(--crema);
    padding: 28px 28px 24px;
    text-align: center;
  }
  .cabecera h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .cabecera .marca {
    margin: 7px 0 0;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--caramelo);
  }
  form { padding: 24px 28px 30px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 0 0 7px;
    color: var(--cafe-medio);
  }
  .campo { margin-bottom: 18px; }
  input {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    color: var(--texto);
    background: var(--crema-input);
    border: 1.5px solid var(--borde);
    border-radius: 11px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none;
  }
  input:focus {
    border-color: var(--caramelo);
    box-shadow: 0 0 0 3px rgba(160, 122, 82, 0.15);
  }
  .seccion-productos { margin-bottom: 14px; }
  .fila {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 9px;
  }
  .fila .prod { flex: 1; min-width: 0; }
  .fila .precio { width: 118px; flex: none; }
  .quitar {
    flex: none;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 9px;
    background: var(--crema);
    color: var(--cafe-medio);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .quitar:hover { background: #f0e3d3; color: var(--error); }
  .agregar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--cafe);
    background: transparent;
    border: 1.5px dashed var(--borde);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .agregar:hover { border-color: var(--caramelo); background: var(--crema-input); }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 18px 0 4px;
    padding-top: 14px;
    border-top: 1px solid var(--borde);
    font-size: 15px;
  }
  .total .etiqueta { color: var(--cafe-medio); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; font-size: 12px; }
  .total .monto { font-size: 18px; font-weight: 700; color: var(--cafe-oscuro); }
  .generar {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--crema);
    background: var(--cafe);
    border: none;
    border-radius: 11px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .generar:hover { background: var(--cafe-medio); }
  .generar:active { transform: translateY(1px); }
  .generar:disabled { opacity: .55; cursor: default; }
  #estado {
    margin: 15px 0 0;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
    color: var(--cafe-medio);
    font-weight: 600;
  }
  #estado.error { color: var(--error); }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="cabecera">
      <h1>Hoja Membretada</h1>
      <p class="marca">Skin Leather · Taller de Cuero</p>
    </div>
    <form id="formulario" autocomplete="off">
      <div class="campo">
        <label for="cliente">Nombre del cliente</label>
        <input type="text" id="cliente">
      </div>

      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="text" id="fecha" inputmode="text">
      </div>

      <label>Productos y precios</label>
      <div class="seccion-productos">
        <div id="productos"></div>
        <button type="button" class="agregar" id="btnAgregar">+ Agregar producto</button>
      </div>

      <div class="total">
        <span class="etiqueta">Total</span>
        <span class="monto" id="total">$ 0</span>
      </div>

      <button type="submit" class="generar" id="btnGenerar">Generar PDF</button>
      <p id="estado"></p>
    </form>
  </div>

<script src="pdf-lib.min.js"></script>
<script>
// La libreria PDFLib se referencia recien al generar el PDF, asi el formulario
// (fecha, filas de productos, total) funciona aunque el CDN tarde o falle.
const MM = 2.834645669; // milimetros a puntos
const A4 = { ancho: 595.28, alto: 841.89 };

// ---- Configuracion (debe coincidir con config.json) ----
const CONFIG = {
  plantilla_pdf: "plantillas/membrete.pdf",
  fuente: { color: "#3b2a1d" },
  simbolo_moneda: "$",
  fecha:   { etiqueta: "Córdoba, ", x: 185, y: 56, tamano: 11, negrita: false, alineacion: "derecha" },
  cliente: { etiqueta: "Cliente: ", x: 25, y: 60, tamano: 13, negrita: true, alineacion: "izquierda" },
  tabla: {
    x_producto: 25, x_precio: 185, y_encabezado: 80, alto_fila: 9,
    tamano: 11, tamano_encabezado: 11,
    encabezado_producto: "PRODUCTO", encabezado_precio: "PRECIO",
    mostrar_total: true, etiqueta_total: "TOTAL"
  }
};

async function cargarConfig() {
  try {
    const res = await fetch("config.json", { cache: "no-store" });
    if (res.ok) {
      const j = await res.json();
      ["fecha", "cliente", "tabla", "fuente"].forEach(k => { if (j[k]) CONFIG[k] = j[k]; });
      if (j.simbolo_moneda) CONFIG.simbolo_moneda = j.simbolo_moneda;
      if (j.plantilla_pdf) CONFIG.plantilla_pdf = j.plantilla_pdf;
    }
  } catch (e) { /* usar config embebida */ }
}

// ---------- utilidades de numero ----------
function parseNumero(valor) {
  if (valor == null) return null;
  const texto = String(valor).trim();
  if (!texto) return null;
  const limpio = texto.replace(/[^\d,.\-]/g, "");
  const candidato = limpio.replace(/\./g, "").replace(/,/g, ".");
  const n = Number(candidato);
  return (candidato === "" || isNaN(n)) ? null : n;
}
function formatearNumero(n, simbolo) {
  const opts = n % 1 === 0
    ? { minimumFractionDigits: 0, maximumFractionDigits: 0 }
    : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
  return `${simbolo} ${n.toLocaleString("es-AR", opts)}`;
}
function formatearPrecio(valor, simbolo) {
  const n = parseNumero(valor);
  if (n == null) {
    const t = String(valor || "").trim();
    if (!t) return "";
    return t.includes(simbolo) ? t : `${simbolo} ${t}`;
  }
  return formatearNumero(n, simbolo);
}
function hoyTexto() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function hexToRgb(hex) {
  const h = (hex || "#3b2a1d").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return PDFLib.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
function nombreArchivoSeguro(t) {
  t = (t || "hoja").trim() || "hoja";
  t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return (t.replace(/[^\w\s.-]/g, "").replace(/\s+/g, "_").slice(0, 60)) || "hoja";
}

// ---------- filas de productos (interfaz) ----------
const cont = document.getElementById("productos");

function agregarFila(producto = "", precio = "") {
  const fila = document.createElement("div");
  fila.className = "fila";
  fila.innerHTML = `
    <input type="text" class="prod" placeholder="Producto">
    <input type="text" class="precio" inputmode="decimal" placeholder="Precio">
    <button type="button" class="quitar" title="Quitar">&times;</button>`;
  fila.querySelector(".prod").value = producto;
  fila.querySelector(".precio").value = precio;
  fila.querySelector(".precio").addEventListener("input", actualizarTotal);
  fila.querySelector(".quitar").addEventListener("click", () => {
    fila.remove();
    if (!cont.querySelector(".fila")) agregarFila();
    actualizarTotal();
  });
  cont.appendChild(fila);
}

function leerProductos() {
  return Array.from(cont.querySelectorAll(".fila")).map(f => ({
    producto: f.querySelector(".prod").value.trim(),
    precio: f.querySelector(".precio").value.trim()
  })).filter(p => p.producto || p.precio);
}

function actualizarTotal() {
  let total = 0;
  leerProductos().forEach(p => { const n = parseNumero(p.precio); if (n != null) total += n; });
  document.getElementById("total").textContent = formatearNumero(total, CONFIG.simbolo_moneda);
}

// ---------- dibujo del PDF ----------
function texto(page, t, xmm, ymm, size, font, color, align, alto) {
  if (t == null || t === "") return;
  const s = String(t);
  let x = xmm * MM;
  const y = alto - ymm * MM;
  if (align === "derecha") x -= font.widthOfTextAtSize(s, size);
  else if (align === "centro") x -= font.widthOfTextAtSize(s, size) / 2;
  page.drawText(s, { x, y, size, font, color });
}
function linea(page, x1mm, x2mm, ymm, color, alto, grosor = 0.7) {
  const y = alto - ymm * MM;
  page.drawLine({ start: { x: x1mm * MM, y }, end: { x: x2mm * MM, y }, thickness: grosor, color });
}

function dibujarContenido(page, font, fontBold, datos) {
  const { height: alto } = page.getSize();
  const color = hexToRgb(CONFIG.fuente.color);
  const simbolo = CONFIG.simbolo_moneda;

  const f = CONFIG.fecha;
  texto(page, (f.etiqueta || "") + datos.fecha, f.x, f.y, f.tamano, f.negrita ? fontBold : font, color, f.alineacion, alto);

  const cl = CONFIG.cliente;
  if (datos.cliente)
    texto(page, (cl.etiqueta || "") + datos.cliente, cl.x, cl.y, cl.tamano, cl.negrita ? fontBold : font, color, cl.alineacion, alto);

  const t = CONFIG.tabla;
  texto(page, t.encabezado_producto, t.x_producto, t.y_encabezado, t.tamano_encabezado, fontBold, color, "izquierda", alto);
  texto(page, t.encabezado_precio, t.x_precio, t.y_encabezado, t.tamano_encabezado, fontBold, color, "derecha", alto);
  linea(page, t.x_producto, t.x_precio, t.y_encabezado + 2, color, alto, 0.9);

  let total = 0, hayTotal = false;
  let yFila = t.y_encabezado + t.alto_fila;
  datos.productos.forEach(p => {
    texto(page, p.producto, t.x_producto, yFila, t.tamano, font, color, "izquierda", alto);
    texto(page, formatearPrecio(p.precio, simbolo), t.x_precio, yFila, t.tamano, font, color, "derecha", alto);
    const n = parseNumero(p.precio);
    if (n != null) { total += n; hayTotal = true; }
    yFila += t.alto_fila;
  });

  if (t.mostrar_total && hayTotal) {
    linea(page, t.x_producto, t.x_precio, yFila - t.alto_fila + 2.5, color, alto, 0.9);
    texto(page, t.etiqueta_total, t.x_producto, yFila + 1, t.tamano, fontBold, color, "izquierda", alto);
    texto(page, formatearNumero(total, simbolo), t.x_precio, yFila + 1, t.tamano, fontBold, color, "derecha", alto);
  }
}

async function generarPDF(datos) {
  if (typeof PDFLib === "undefined") {
    throw new Error("no se pudo cargar el generador (revisá tu conexión)");
  }
  const { PDFDocument, StandardFonts } = PDFLib;
  let pdfDoc, page, usarPlantilla = false;
  try {
    const res = await fetch(CONFIG.plantilla_pdf, { cache: "no-store" });
    if (res.ok) {
      const ct = res.headers.get("content-type") || "";
      const bytes = await res.arrayBuffer();
      if (bytes.byteLength > 100 && !ct.includes("text/html")) {
        pdfDoc = await PDFDocument.load(bytes);
        page = pdfDoc.getPage(0);
        usarPlantilla = true;
      }
    }
  } catch (e) { /* sin plantilla */ }

  if (!usarPlantilla) {
    pdfDoc = await PDFDocument.create();
    page = pdfDoc.addPage([A4.ancho, A4.alto]);
  }
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  dibujarContenido(page, font, fontBold, datos);
  return await pdfDoc.save();
}

function descargar(bytes, nombre) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ---------- arranque ----------
document.getElementById("fecha").value = hoyTexto();
agregarFila();
cargarConfig().then(actualizarTotal);
document.getElementById("btnAgregar").addEventListener("click", () => agregarFila());

document.getElementById("formulario").addEventListener("submit", async (e) => {
  e.preventDefault();
  const estado = document.getElementById("estado");
  const btn = document.getElementById("btnGenerar");
  estado.classList.remove("error");

  const cliente = document.getElementById("cliente").value.trim();
  const productos = leerProductos().filter(p => p.producto);
  if (!cliente) { estado.classList.add("error"); estado.textContent = "Ingresá el nombre del cliente."; return; }
  if (productos.length === 0) { estado.classList.add("error"); estado.textContent = "Agregá al menos un producto."; return; }

  const datos = {
    fecha: document.getElementById("fecha").value.trim() || hoyTexto(),
    cliente, productos
  };

  btn.disabled = true;
  estado.style.color = "var(--cafe-medio)";
  estado.textContent = "Generando...";
  try {
    const bytes = await generarPDF(datos);
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    descargar(bytes, `hoja_${nombreArchivoSeguro(cliente)}_${ymd}.pdf`);
    estado.style.color = ""; estado.textContent = "¡Listo! PDF descargado.";
  } catch (err) {
    estado.classList.add("error"); estado.textContent = "Error al generar: " + err.message;
  } finally {
    btn.disabled = false;
  }
});

// Registrar el service worker para que la app funcione sin internet.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
